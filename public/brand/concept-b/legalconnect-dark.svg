<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" fill="none">
  <title>LegalConnect — Concept B (Legal Technology) Dark Version</title>
  <!-- Mark: LC Monogram (white on dark) -->
  <rect x="18" y="14" width="20" height="72" rx="4" fill="#FFFFFF"/>
  <rect x="18" y="70" width="48" height="20" rx="4" fill="#FFFFFF"/>
  <rect x="55" y="14" width="46" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="55" y="70" width="46" height="18" rx="4" fill="#FFFFFF"/>
