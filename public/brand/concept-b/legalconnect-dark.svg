  <text x="120" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#FFFFFF">LegalConnect</text>
  <!-- Tagline -->
  <text x="122" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="3.5" opacity="0.8">THE LAW FIRM OPERATING SYSTEM</text>
